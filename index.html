<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
const peer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true });
let call, roomId, stream;

// Проверяем, есть ли приглашение в ссылке
const params = new URLSearchParams(window.location.search);
const inviteCode = params.get('startapp')?.replace('room_', '');

if (inviteCode) {
  // Присоединяемся автоматически
  startCall(inviteCode);
} else {
  // Создаем комнату и показываем ссылку
  createRoom();
}

async function createRoom() {
  roomId = Math.random().toString(36).slice(2, 8);
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  
  peer.on('call', (incoming) => {
    if (call) { incoming.close(); return; }
    call = incoming;
    call.answer(stream);
    call.on('stream', (remote) => {
      document.querySelector('audio').srcObject = remote;
    });
  });
  
  const link = `https://t.me/CallWayRobot/call?startapp=room_${roomId}`;
  // Копируем ссылку и показываем
  navigator.clipboard.writeText(link);
  document.body.innerHTML = `Ссылка скопирована: ${link}`;
}

async function startCall(id) {
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  call = peer.call(id, stream);
  call.on('stream', (remote) => {
    document.querySelector('audio').srcObject = remote;
  });
}
</script>
<audio autoplay></audio>
