<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
const peer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true });
let call, roomId, stream;

// Автоматически подключаемся, если перешли по ссылке
const params = new URLSearchParams(window.location.search);
const inviteCode = params.get('startapp')?.replace('room_', '');

if (inviteCode) {
  joinRoom(inviteCode);
}

async function createRoom() {
  roomId = Math.random().toString(36).slice(2, 8);
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  
  peer.on('call', (incoming) => {
    if (call) { incoming.close(); return; }
    call = incoming;
    call.answer(stream);
    call.on('stream', (remote) => {
      document.querySelector('audio').srcObject = remote;
    });
  });
  
  const link = `https://t.me/CallWayRobot/call?startapp=room_${roomId}`;
  navigator.share({ text: `Присоединяйся: ${link}` });
}

async function joinRoom(id) {
  if (!stream) {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }
  call = peer.call(id, stream);
  call.on('stream', (remote) => {
    document.querySelector('audio').srcObject = remote;
  });
}
</script>

<button onclick="createRoom()">🔊 Создать звонок</button>
<audio autoplay></audio>
