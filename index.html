<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Звонки</title>
</head>
<body>
  <button onclick="createRoom()">Создать звонок</button>
  <button onclick="joinRoom()">Присоединиться</button>
  <audio autoplay></audio>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    const peer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true });
    let call, roomId;

    async function createRoom() {
      roomId = Math.random().toString(36).slice(2, 8);
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      
      peer.on('call', (incoming) => {
        if (call) { incoming.close(); return; }
        call = incoming;
        call.answer(stream);
        call.on('stream', (remote) => {
          document.querySelector('audio').srcObject = remote;
        });
      });
      
      const link = `https://t.me/ваш_бот/ваша_апп?startapp=room_${roomId}`;
      alert(`Твоя ссылка: ${link}`);
    }

    async function joinRoom() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('startapp')?.replace('room_', '');
      if (!id) { alert('Нет кода в ссылке'); return; }
      
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      call = peer.call(id, stream);
      call.on('stream', (remote) => {
        document.querySelector('audio').srcObject = remote;
      });
    }

    // Автоподключение если есть параметр
    joinRoom();
  </script>
</body>
</html>
